project_id = "tap2work"

[functions.account]
# Handler verifies the bearer session against Auth; user IDs never come from UI.
verify_jwt = false
entrypoint = "./functions/account/index.ts"

[functions.operations]
# The handler validates bearer sessions with Supabase Auth, including new signing keys.
verify_jwt = false
entrypoint = "./functions/operations/index.ts"

[functions.public-login]
verify_jwt = false
entrypoint = "./functions/public-login/index.ts"

[functions.catalog-admin]
verify_jwt = false
entrypoint = "./functions/catalog-admin/index.ts"

[functions.manual-media-cleanup]
# Short-lived HMAC bearer is verified with the Vault/Edge secret; no user JWT.
verify_jwt = false
entrypoint = "./functions/manual-media-cleanup/index.ts"
