<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#203d34">
    <meta name="description" content="처음 하는 일도, 함께 한 걸음씩. 작은 주방을 위한 모바일 온보딩.">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
    <title>tap2work — 함께 시작하는 첫 근무</title>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 이동</a>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#today" aria-label="tap2work 홈"><span class="brand-mark" aria-hidden="true">t<span>2</span></span>tap2work<span class="brand-dot">.</span></a>
        <div class="workspace"><span class="cafe-icon" aria-hidden="true">◒</span><div><strong>작은주방 · 연남</strong><span>우리 팀의 시작 공간</span></div></div>
        <nav id="desktop-nav" aria-label="주 메뉴"></nav>
        <div class="sidebar-note"><span class="eyebrow">함께 시작하는 첫 근무</span><p>처음이어도,<br>혼자가 아니니까.</p><span class="tiny">한 번에 하나씩, 함께 배워요.</span></div>
      </aside>
      <div class="main-shell">
        <header class="topbar"><a href="#today" class="mobile-brand">tap2work<span>.</span></a><span class="topbar-label">함께 시작하는 첫 근무</span><button class="profile-button" id="role-button" aria-label="데모 역할 바꾸기"><span class="avatar">지</span><span id="role-label">신입 모드</span><span aria-hidden="true">⌄</span></button></header>
        <div class="demo-banner"><span class="demo-dot" aria-hidden="true"></span><span>체험 버전 · 가상 매장 · 이 기기에만 저장돼요</span><button id="about-button" aria-label="체험 버전 안내">ⓘ</button></div>
        <main id="main" tabindex="-1"></main>
        <footer class="page-footer"><span>한 번에 하나씩, 함께 배워요.</span><button id="install-button">홈 화면에 추가 <span aria-hidden="true">↗</span></button></footer>
      </div>
      <nav id="mobile-nav" class="mobile-nav" aria-label="모바일 메뉴"></nav>
    </div>
    <dialog id="detail-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
